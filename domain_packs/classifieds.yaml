name: classifieds
aliases: [classified, classifieds, marketplace, olx, buy and sell, listings]
features:
  - {id: CL-01, name: Post an ad with photos, tier: table_stakes}
  - {id: CL-02, name: Category and sub-category browsing, tier: table_stakes}
  - {id: CL-03, name: "Search with filters (price, location, category, condition)", tier: table_stakes}
  - {id: CL-04, name: Location-based listings, tier: table_stakes}
  - {id: CL-05, name: In-app buyer-seller chat, tier: table_stakes}
  - {id: CL-06, name: User registration and login (phone OTP), tier: table_stakes}
  - {id: CL-07, name: "My ads (edit, mark as sold, delete)", tier: table_stakes}
  - {id: CL-08, name: Favourites or saved ads, tier: table_stakes}
  - {id: CL-09, name: Report ad or user, tier: table_stakes}
  - {id: CL-10, name: Admin moderation of ads and users, tier: table_stakes}
  - {id: CL-11, name: Push notifications for chats and ad status, tier: table_stakes}
  - {id: CL-12, name: Seller profile and ratings, tier: common}
  - {id: CL-13, name: Seller or phone verification badge, tier: common}
  - {id: CL-14, name: Featured or boosted ads, tier: common}
  - {id: CL-15, name: Saved searches with alerts, tier: common}
  - {id: CL-16, name: Share ad to social apps, tier: common}
  - {id: CL-17, name: Multi-language support, tier: common}
nfrs:
  - Image upload compression and fast listing load on slow mobile networks
  - Spam and fake-listing detection
  - Search response time under load
  - Data retention and deletion of user accounts
compliance:
  - {region: India, note: "Digital Personal Data Protection Act, 2023: consent, purpose limits, deletion requests"}
  - {region: India, note: "IT (Intermediary Guidelines) Rules, 2021: grievance officer and takedown process for user content"}

# Default UI direction for Stage 4 (ui_designer). A client's "UI direction" adjusts it; code keeps
# colours readable (contrast) and never uses a competitor's brand.
ui:
  tagline: Buy and sell near you
  primary: "#0F766E"
  accent: "#F59E0B"
  font: rounded
  radius: round
  density: comfortable
  mood: friendly, local, trustworthy
  ux_principles:
    - "Search first: a large search box and the buyer's city on every list screen"
    - Photo-first cards with the price in large type and the city and age of the ad below
    - "Posting an ad takes under a minute: three short steps, not one long form"
    - "Trust signals near contact buttons: member since, verified phone, safety tips"
    - "Moderation is visible: sellers see 'Under review', 'Live' or 'Sold' on their ads"
  category_icons: {Mobiles: "📱", Cars: "🚗", Bikes: "🏍️", Property: "🏠", Electronics: "💻", Furniture: "🛋️", Jobs: "💼"}
  safety_tips:
    - Meet in a public place and check the item before you pay
    - Never pay in advance or share an OTP
    - Report ads that look too good to be true
