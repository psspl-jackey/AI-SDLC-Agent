# Runnable React (Vite) starter (customer website or admin panel). UI code comes from starters/ui/<surface>.
pack: react_web
platforms: [web, admin_panel]
dir: {admin_panel: apps/admin, web: apps/web}
port: {admin_panel: 3000, web: 3001}
ui: true
install:
  - "npm install --no-audit --no-fund"
test:
  - "npm run build"
start: "npx vite --host 0.0.0.0 --port {port} --strictPort"
url: "http://localhost:{port}"
