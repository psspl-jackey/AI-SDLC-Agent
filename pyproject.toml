[project]
name = "sdlc-agent"
version = "0.1.0"
description = "AI SDLC Agent: any requirement in, gap-checked requirements out (Phase 1 foundation)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "streamlit>=1.46",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
